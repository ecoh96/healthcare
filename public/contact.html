  <section class="contact_section layout_padding">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-5 col-lg-4 offset-md-1">
          <div class="form_container">
            <div class="heading_container">
              <h2>
                문의하기
              </h2>
            </div>
            <form id="contact-form">
              <div>
                  <input type="text" id="name" name="name" placeholder="성함 " required />
              </div>
              <div>
                  <input type="text" id="phone" name="phone" placeholder="연락처" required />
              </div>
              <div>
                  <input type="text" id="email" name="email" placeholder="이메일" required />
              </div>
              <div>
                  <input type="text" id="message" name="message" class="message-box" placeholder="내용" required />
              </div>
              <div class="d-flex">
                  <button type="submit">보내기</button>
              </div>
          </form>
      
          <script>
              document.getElementById('contact-form').addEventListener('submit', async function(event) {
                  event.preventDefault();
                  const formData = new FormData(event.target);
                  const data = {
                      name: formData.get('name'),
                      phone: formData.get('phone'),
                      email: formData.get('email'),
                      message: formData.get('message')
                  };
      
                  const response = await fetch('/.netlify/functions/send-email', {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify(data)
                  });
      
                  const result = await response.json();
                  alert(result.message);
              });
          </script>
        
        <div class="col-md-6 col-lg-7 px-0">
          <div class="map_container">
            <div class="map">
              <div id="googleMap"></div>
            </div>
          </div>
        </div>
      </div>
